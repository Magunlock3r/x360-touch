name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # Saves the build log to the ci-log branch so it can be read through the API.
      - name: Publish build log
        if: always()
        run: |
          [ -f build.log ] || exit 0
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/ci && cp build.log /tmp/ci/build.log
          git checkout --orphan ci-log
          git rm -rfq . || true
          cp /tmp/ci/build.log build.log
          git add build.log
          git commit -qm "build log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Gears-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Gears-apk
          path: Gears-${{ github.run_number }}.apk

      # A release makes the APK downloadable from the phone without logging into Actions.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gears build ${{ github.run_number }}
          files: Gears-${{ github.run_number }}.apk
          make_latest: true
